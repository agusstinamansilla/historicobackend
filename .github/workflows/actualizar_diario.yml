name: Actualizar historico diario (fondos + cedears)

# Corre solo, todos los dias de lunes a viernes a las 12:00 UTC = 09:00 hora Argentina
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}  # tambien se puede disparar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - name: Instalar dependencias
        run: pip install pandas openpyxl requests yfinance
      - name: Actualizar historico de fondos (CAFCI)
        run: python actualizar_historico_cafci.py
      - name: Actualizar historico de CEDEARs (Yahoo)
        run: python actualizar_cedears_yahoo.py        
      - name: Comitear cambios (si hubo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.csv cedears_historico.csv
          git diff --staged --quiet || git commit -m "Actualizacion diaria - $(date +'%Y-%m-%d')"
          git push
